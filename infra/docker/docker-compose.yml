name: fides

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fides}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fides_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fides}
    ports:
      # Host 5433 by default to avoid colliding with a native Postgres on 5432.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fides} -d ${POSTGRES_DB:-fides}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fides_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fides_minio_local_dev}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./.data/minio:/data

  # One-shot: create the documents bucket, then exit.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-fides_minio} ${S3_SECRET_KEY:-fides_minio_local_dev}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-fides-documents};
      echo 'minio bucket ready';
      "
